description: BetSolutions provides a casino and gaming platform API offering a two-way HTTP API with JSON data format for
  implementing requests and responses for slots, single and multiplayer games, and other casino platform services. The platform
  supports transfer and seamless wallet integration modes, slot campaigns with freespins, table games, provably fair games,
  poker, and third-party sportsbook integrations. Authentication uses SHA-256 hash-based signing with merchant secret keys.
