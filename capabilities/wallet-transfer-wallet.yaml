naftiko: 1.0.0-alpha2
info:
  label: BetSolutions Wallet API — Transfer Wallet
  description: 'BetSolutions Wallet API — Transfer Wallet. 4 operations. Lead operation: BetSolutions Authenticate Player.
    Self-contained Naftiko capability covering one Betsolutions business surface.'
  tags:
  - Betsolutions
  - Transfer Wallet
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BETSOLUTIONS_API_KEY: BETSOLUTIONS_API_KEY
capability:
  consumes:
  - type: http
    namespace: wallet-transfer-wallet
    baseUri: https://api.betsolutions.com/v1
    description: BetSolutions Wallet API — Transfer Wallet business capability. Self-contained, no shared references.
    resources:
    - name: wallet-auth
      path: /wallet/auth
      operations:
      - name: authenticateplayer
        method: GET
        description: BetSolutions Authenticate Player
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: merchantId
          in: query
          type: string
          description: The merchant's unique identifier.
          required: true
        - name: token
          in: query
          type: string
          description: The public player token to exchange for a private token.
          required: true
        - name: hash
          in: query
          type: string
          description: SHA-256 hash of concatenated parameters with merchant secret key.
          required: true
    - name: wallet-balance
      path: /wallet/balance
      operations:
      - name: getbalance
        method: POST
        description: BetSolutions Get Player Balance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: wallet-deposit
      path: /wallet/deposit
      operations:
      - name: depositfunds
        method: POST
        description: BetSolutions Deposit Funds
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: wallet-withdraw
      path: /wallet/withdraw
      operations:
      - name: withdrawfunds
        method: POST
        description: BetSolutions Withdraw Funds
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: hash
      value: '{{env.BETSOLUTIONS_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: wallet-transfer-wallet-rest
    port: 8080
    description: REST adapter for BetSolutions Wallet API — Transfer Wallet. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/wallet/auth
      name: wallet-auth
      description: REST surface for wallet-auth.
      operations:
      - method: GET
        name: authenticateplayer
        description: BetSolutions Authenticate Player
        call: wallet-transfer-wallet.authenticateplayer
        with:
          merchantId: rest.merchantId
          token: rest.token
          hash: rest.hash
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/wallet/balance
      name: wallet-balance
      description: REST surface for wallet-balance.
      operations:
      - method: POST
        name: getbalance
        description: BetSolutions Get Player Balance
        call: wallet-transfer-wallet.getbalance
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/wallet/deposit
      name: wallet-deposit
      description: REST surface for wallet-deposit.
      operations:
      - method: POST
        name: depositfunds
        description: BetSolutions Deposit Funds
        call: wallet-transfer-wallet.depositfunds
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/wallet/withdraw
      name: wallet-withdraw
      description: REST surface for wallet-withdraw.
      operations:
      - method: POST
        name: withdrawfunds
        description: BetSolutions Withdraw Funds
        call: wallet-transfer-wallet.withdrawfunds
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wallet-transfer-wallet-mcp
    port: 9090
    transport: http
    description: MCP adapter for BetSolutions Wallet API — Transfer Wallet. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: betsolutions-authenticate-player
      description: BetSolutions Authenticate Player
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wallet-transfer-wallet.authenticateplayer
      with:
        merchantId: tools.merchantId
        token: tools.token
        hash: tools.hash
      outputParameters:
      - type: object
        mapping: $.
    - name: betsolutions-get-player-balance
      description: BetSolutions Get Player Balance
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: wallet-transfer-wallet.getbalance
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: betsolutions-deposit-funds
      description: BetSolutions Deposit Funds
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: wallet-transfer-wallet.depositfunds
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: betsolutions-withdraw-funds
      description: BetSolutions Withdraw Funds
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: wallet-transfer-wallet.withdrawfunds
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
